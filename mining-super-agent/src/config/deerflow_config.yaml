# DeerFlow Configuration for Mining Super-Agent
# This is the primary config file that DeerFlow uses at runtime.
# Environment variables are referenced with $VAR_NAME syntax.

config_version: 29

# ============================================================================
# Logging
# ============================================================================
log_level: info

logging:
  enhance:
    enabled: false
    format: text

# ============================================================================
# Token Usage & Budget
# ============================================================================
token_usage:
  enabled: true

token_budget:
  enabled: true
  max_tokens: 200000
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

max_recursion_limit: 100

# ============================================================================
# Models — NVIDIA NIM as primary provider
# ============================================================================
models:
  # Primary: Nemotron Ultra (complex reasoning, orchestrator-tier)
  - name: nemotron-ultra
    display_name: NVIDIA Nemotron Ultra
    use: langchain_openai:ChatOpenAI
    model: nvidia/llama-3.1-nemotron-ultra-253b-v1
    api_key: $NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.7
    supports_vision: false

  # Tier 2: Llama 405B (deep analysis)
  - name: llama-405b
    display_name: Llama 3.1 405B Instruct
    use: langchain_openai:ChatOpenAI
    model: meta/llama-3.1-405b-instruct
    api_key: $NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.7
    supports_vision: false

  # Tier 3: Llama 8B (fast tasks)
  - name: llama-8b
    display_name: Llama 3.1 8B Instruct
    use: langchain_openai:ChatOpenAI
    model: meta/llama-3.1-8b-instruct
    api_key: $NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    request_timeout: 120.0
    max_retries: 2
    max_tokens: 2048
    temperature: 0.7
    supports_vision: false

  # Vision model for mineral photo identification
  - name: llama-vision
    display_name: Llama 3.2 Vision
    use: langchain_openai:ChatOpenAI
    model: meta/llama-3.2-90b-vision-instruct
    api_key: $NVIDIA_API_KEY
    base_url: https://integrate.api.nvidia.com/v1
    request_timeout: 300.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.5
    supports_vision: true

  # Fallback: Groq (fast inference)
  - name: groq-llama
    display_name: Groq Llama 3.1 70B
    use: langchain_openai:ChatOpenAI
    model: llama-3.1-70b-versatile
    api_key: $GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    request_timeout: 120.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.7
    supports_vision: false

# Default model for the lead agent
default_model: nemotron-ultra

# ============================================================================
# Tools — Mining domain tools registered via DeerFlow's tool system
# ============================================================================
tools:
  # Geological tools
  - name: query_geological_database
    group: geological
    use: src.tools.deerflow_tools:query_geological_database_tool

  - name: run_gempy_model
    group: geological
    use: src.tools.deerflow_tools:run_gempy_model_tool

  - name: query_mindat
    group: geological
    use: src.tools.deerflow_tools:query_mindat_tool

  - name: run_geophysical_inversion
    group: geological
    use: src.tools.deerflow_tools:run_geophysical_inversion_tool

  # Satellite tools
  - name: query_sentinel2
    group: satellite
    use: src.tools.deerflow_tools:query_sentinel2_tool

  - name: calculate_spectral_indices
    group: satellite
    use: src.tools.deerflow_tools:calculate_spectral_indices_tool

  - name: detect_alteration_zones
    group: satellite
    use: src.tools.deerflow_tools:detect_alteration_zones_tool

  # Mineral identification tools
  - name: identify_mineral_photo
    group: mineral_id
    use: src.tools.deerflow_tools:identify_mineral_photo_tool

  - name: classify_with_clip
    group: mineral_id
    use: src.tools.deerflow_tools:classify_with_clip_tool

  # Market data tools
  - name: get_commodity_price
    group: market
    use: src.tools.deerflow_tools:get_commodity_price_tool

  - name: get_price_history
    group: market
    use: src.tools.deerflow_tools:get_price_history_tool

  - name: analyze_price_trend
    group: market
    use: src.tools.deerflow_tools:analyze_price_trend_tool

  # Legal & compliance tools
  - name: check_license_requirements
    group: legal
    use: src.tools.deerflow_tools:check_license_requirements_tool

  - name: check_eia_requirements
    group: legal
    use: src.tools.deerflow_tools:check_eia_requirements_tool

  - name: check_fpic_requirements
    group: legal
    use: src.tools.deerflow_tools:check_fpic_requirements_tool

  - name: generate_compliance_checklist
    group: legal
    use: src.tools.deerflow_tools:generate_compliance_checklist_tool

  # Financial tools
  - name: calculate_npv_irr
    group: financial
    use: src.tools.deerflow_tools:calculate_npv_irr_tool

  - name: estimate_capex
    group: financial
    use: src.tools.deerflow_tools:estimate_capex_tool

  - name: sensitivity_analysis
    group: financial
    use: src.tools.deerflow_tools:sensitivity_analysis_tool

  # Community & stakeholder tools
  - name: stakeholder_analysis
    group: community
    use: src.tools.deerflow_tools:stakeholder_analysis_tool

  - name: fpic_guidance
    group: community
    use: src.tools.deerflow_tools:fpic_guidance_tool

  # Exploration planning tools
  - name: design_drilling_program
    group: exploration
    use: src.tools.deerflow_tools:design_drilling_program_tool

  - name: design_sampling_strategy
    group: exploration
    use: src.tools.deerflow_tools:design_sampling_strategy_tool

  # Quality control tools
  - name: cross_check_results
    group: qc
    use: src.tools.deerflow_tools:cross_check_results_tool

  - name: validate_confidence
    group: qc
    use: src.tools.deerflow_tools:validate_confidence_tool

  # Report generation tools
  - name: generate_mining_report
    group: reports
    use: src.tools.deerflow_tools:generate_mining_report_tool

# ============================================================================
# Tool Groups — enable/disable groups
# ============================================================================
tool_groups:
  - name: geological
  - name: satellite
  - name: mineral_id
  - name: market
  - name: legal
  - name: financial
  - name: community
  - name: exploration
  - name: qc
  - name: reports

# ============================================================================
# Sandbox — Code execution environment
# ============================================================================
sandbox:
  # Use local sandbox for mining computations (GemPy, rasterio, etc.)
  provider: local
  # Allow bash for running geological models and data processing
  bash_enabled: true
  # Allow file writes for report generation
  file_write_enabled: true
  # Working directory for sandbox operations
  work_dir: .deer-flow/sandbox

# ============================================================================
# Memory — Long-term memory for mining context
# ============================================================================
memory:
  enabled: true
  # Use local file-based memory (no external DB required)
  provider: local
  # Store memory per-user for personalized mining advice
  per_user: true
  # Memory directory
  dir: .deer-flow/memory

# ============================================================================
# Channels — Telegram bot integration
# ============================================================================
channels:
  telegram:
    enabled: true
    token: $TELEGRAM_BOT_TOKEN
    # Allow all users (mining community access)
    allowed_users: []
    # Webhook mode for production, polling for development
    mode: polling

# ============================================================================
# Skills — Mining domain skills
# ============================================================================
skills:
  enabled: true
  scan_dirs:
    - src/skills

# ============================================================================
# Sub-agents
# ============================================================================
subagents:
  enabled: true
  max_depth: 3
  max_concurrent: 5

# ============================================================================
# Suggestions — Follow-up question suggestions
# ============================================================================
suggestions:
  enabled: true
  max_suggestions: 3

# ============================================================================
# Title Generation
# ============================================================================
title:
  enabled: true
