# Mining Super-Agent — DeerFlow 2.0 Configuration
# This is a SUPERAGENT (one intelligent agent with specialized tools)
# NOT a multi-agent system (multiple agents talking to each other)
#
# Jensen Huang's vision: "We create super sub-agents. That super agent
# is not trying to book me travel. It's just trying to optimize our
# supply chain. I connect it to a lot of proprietary knowledge and
# proprietary skills."

# ─── Superagent Configuration ─────────────────────────────────────
agent:
  name: "Mining Super-Agent"
  description: "AI-powered digital geologist for Kenyan miners"
  model: "nvidia/nemotron-3-ultra"  # Primary model via NVIDIA NIM
  fallback_model: "meta/llama-3.1-405b-instruct"  # Fallback
  fast_model: "meta/llama-3.1-8b-instruct"  # For simple tasks
  
  # System prompt — the superagent's identity
  system_prompt: |
    You are a Mining Super-Agent — an AI-powered digital geologist 
    built for Kenyan miners. You help miners understand what minerals 
    are on their land, what they're worth, and how to negotiate fair deals.
    
    You speak Swahili first, English second. You are honest about 
    uncertainty — you never claim certainty about mineral identification 
    from photos alone. You always recommend physical verification for 
    economic decisions.
    
    You have access to specialized tools for geological analysis, 
    satellite imagery, mineral identification, market data, legal 
    information, financial modeling, and quantum computing. You use 
    these tools to help miners — you don't guess, you analyze.
    
    Your goal: End mineral exploitation in Kenya by giving miners 
    the same data that foreign companies use to exploit them.

# ─── Tools (Connected to the Superagent) ──────────────────────────
# These are NOT separate agents. They are TOOLS that the superagent uses.
# The superagent decides which tool to use based on the user's question.

tools:
  # Geological Analysis
  geological_database:
    description: "Query geological data for Kenya (rock types, formations, mineral deposits)"
    module: "src.tools.geological"
    function: "query_geology"
    
  gempy_3d:
    description: "Create 3D geological models from surface data"
    module: "src.tools.geological"
    function: "create_3d_model"
    
  simpeg_inversion:
    description: "Run geophysical inversion on survey data"
    module: "src.tools.geological"
    function: "run_inversion"

  # Satellite Analysis
  sentinel2:
    description: "Analyze Sentinel-2 satellite imagery for geological features"
    module: "src.tools.satellite"
    function: "analyze_sentinel2"
    
  alteration_mapping:
    description: "Map alteration zones from satellite data (NDVI, clay, iron oxide)"
    module: "src.tools.satellite"
    function: "map_alteration"

  # Mineral Identification
  mineral_photo_id:
    description: "Identify minerals from photos using EfficientNet-B4"
    module: "src.tools.vision"
    function: "identify_mineral_from_photo"
    constraints:
      - "Max confidence for photo-only ID: 65%"
      - "NEVER classify pyrite as gold"
      - "Always include Swahili disclaimer"
      
  xrf_analysis:
    description: "Process XRF spectral data for precise mineral identification"
    module: "src.tools.vision"
    function: "analyze_xrf"

  # Market Data
  commodity_price:
    description: "Get current commodity prices (gold, copper, rare earths)"
    module: "src.tools.market"
    function: "get_price"
    
  price_trend:
    description: "Get price trends and predictions"
    module: "src.tools.market"
    function: "get_trend"

  # Legal Information
  mining_act:
    description: "Query Kenya Mining Act 2016 for legal information"
    module: "src.tools.legal"
    function: "query_mining_act"
    
  licensing:
    description: "Get licensing requirements and procedures"
    module: "src.tools.legal"
    function: "get_licensing_info"

  # Financial Modeling
  npv_calculator:
    description: "Calculate NPV/IRR for mining projects"
    module: "src.tools.financial"
    function: "calculate_npv"
    constraints:
      - "Always use conservative assumptions"
      - "Show sensitivity analysis"
      - "Include disclaimers (indicative, not bankable)"
      
  valuation:
    description: "Estimate land/mineral value"
    module: "src.tools.financial"
    function: "estimate_value"

  # Quantum Computing
  quantum_classifier:
    description: "Quantum kernel methods for mineral classification"
    module: "src.tools.quantum"
    function: "quantum_classify"
    fallback: "classical_classifier"
    
  quantum_optimizer:
    description: "QAOA optimization for drill target selection"
    module: "src.tools.quantum"
    function: "quantum_optimize"
    fallback: "classical_optimize"

  # Report Generation
  generate_report:
    description: "Generate professional PDF geological report"
    module: "src.tools.reports"
    function: "generate_pdf"

# ─── Telegram (DeerFlow Built-in) ─────────────────────────────────
# NO custom bot code needed. Just paste your token here.
# DeerFlow handles all Telegram integration natively.

channels:
  telegram:
    enabled: true
    token: "${TELEGRAM_BOT_TOKEN}"  # From @BotFather
    # Natural conversation, NOT commands
    # DeerFlow handles: text, photos, voice, location, documents
    # Multi-language: Swahili, English, Luo (detected automatically)

# ─── Memory (DeerFlow Built-in) ───────────────────────────────────
memory:
  session_memory:
    enabled: true
    ttl_hours: 24  # Session expires after 24 hours
    max_messages: 10  # Keep last 10 messages for context
    
  long_term_memory:
    enabled: true
    storage: "postgresql"  # Store in PostgreSQL
    # Every mineral observation, every analysis, every interaction
    # feeds the flywheel — the system gets smarter over time

# ─── Sandboxes (DeerFlow Built-in) ────────────────────────────────
sandboxes:
  python:
    enabled: true
    timeout_seconds: 30
    # Agents can run Python code safely
    
  geological:
    enabled: true
    timeout_seconds: 60
    # GemPy, SimPEG, geological calculations

# ─── Knowledge Base (RAG) ─────────────────────────────────────────
knowledge:
  vector_db: "qdrant"
  embedding_model: "BAAI/bge-large-en-v1.5"
  reranker: "BAAI/bge-reranker-v2-m3"
  
  sources:
    - name: "Kenya Mining Act 2016"
      type: "document"
      path: "data/legal/mining_act_2016.pdf"
      
    - name: "Migori Geology"
      type: "document"
      path: "data/geology/migori_greenstone_belt.pdf"
      
    - name: "Mineral Identification Guide"
      type: "document"
      path: "data/geology/mineral_id_guide.pdf"
      
    - name: "East African Geological Surveys"
      type: "document"
      path: "data/geology/east_africa_surveys/"

# ─── Guardrails ────────────────────────────────────────────────────
guardrails:
  # Pyrite must NEVER be classified as gold
  hard_rules:
    - rule: "pyrite_not_gold"
      description: "Pyrite (FeS2) must never be identified as gold (Au)"
      enforcement: "hard_assertion"
      
    - rule: "economic_mineral_review"
      description: "Economic minerals (gold, copper, rare earths) require expert review"
      enforcement: "soft_warning"
      
    - rule: "confidence_cap"
      description: "Photo-only mineral ID cannot exceed 65% confidence"
      enforcement: "hard_cap"
      
  # Swahili disclaimer on every mineral identification
  disclaimers:
    mineral_id: "Hii si uthibitisho wa maabara. Tafadhali thibitisha na mtihani wa kimwili."
    financial: "Hii ni takwimu tu, si uthibitisho wa kibenki. Tafadhali shauriana na mtaalamu."
    legal: "Hii ni taarifa ya jumla. Tafadhali shauriana na wakili kwa ushauri wa kisheria."
