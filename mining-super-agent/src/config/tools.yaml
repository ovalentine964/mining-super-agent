# tools.yaml — Tool definitions for the Mining Super-Agent
# All tools with endpoints, auth, caching, rate limits, and fallback chains.

tools:
  # =========================================================================
  # GEOLOGICAL TOOLS
  # =========================================================================
  query_geological_database:
    name: "query_geological_database"
    description: "Query local geological database (PostGIS) for rock units, minerals, structures"
    module: "src.tools.geological.geological_database_query"
    permissions: ["read:geo"]
    timeout_seconds: 15
    rate_limit:
      requests_per_minute: 60
      requests_per_hour: 1000
    cache:
      enabled: true
      ttl_seconds: 3600  # 1 hour — geological data changes slowly
      strategy: "exact"
    fallback:
      tools: ["query_mindat", "usgs_mrdata_query"]

  run_gempy_model:
    name: "run_gempy_model"
    description: "Run GemPy 3D geological model"
    module: "src.tools.geological.gempy_3d_model"
    permissions: ["read:geo", "compute:geo"]
    timeout_seconds: 120
    rate_limit:
      requests_per_minute: 5
      requests_per_hour: 50
    cache:
      enabled: true
      ttl_seconds: 7200  # 2 hours — models are expensive to compute
    fallback:
      tools: []

  query_mindat:
    name: "query_mindat"
    description: "Query Mindat.org API for mineral occurrence data"
    module: "src.tools.geological.mindat_query"
    auth_env_var: "MINDAT_API_KEY"
    endpoint: "https://api.mindat.org/v3"
    permissions: ["read:geo", "api:mindat"]
    timeout_seconds: 30
    rate_limit:
      requests_per_minute: 20
      requests_per_hour: 500
    cache:
      enabled: true
      ttl_seconds: 86400  # 24 hours — mineral data changes rarely
    fallback:
      tools: ["usgs_mrdata_query", "query_geological_database"]

  usgs_mrdata_query:
    name: "usgs_mrdata_query"
    description: "Query USGS Mineral Resources Data System"
    module: "src.tools.geological.usgs_mrdata_query"
    endpoint: "https://mrdata.usgs.gov/wfs/mrds"
    permissions: ["read:geo"]
    timeout_seconds: 30
    rate_limit:
      requests_per_minute: 30
      requests_per_hour: 500
    cache:
      enabled: true
      ttl_seconds: 86400
    fallback:
      tools: ["query_geological_database"]

  analyze_deposit_model:
    name: "analyze_deposit_model"
    description: "Match observations to known deposit models"
    module: "src.agents.geological.analyze_deposit_model"
    permissions: ["read:geo"]
    timeout_seconds: 15
    rate_limit:
      requests_per_minute: 30
      requests_per_hour: 200
    cache:
      enabled: true
      ttl_seconds: 3600
    fallback:
      tools: []

  run_geophysical_inversion:
    name: "run_geophysical_inversion"
    description: "Run SimPEG geophysical inversion"
    module: "src.tools.geological.simpeg_inversion"
    permissions: ["read:geo", "compute:geo"]
    timeout_seconds: 300  # 5 minutes — inversions are compute-heavy
    rate_limit:
      requests_per_minute: 2
      requests_per_hour: 20
    cache:
      enabled: true
      ttl_seconds: 7200
    fallback:
      tools: []

  # =========================================================================
  # SATELLITE TOOLS
  # =========================================================================
  query_sentinel2:
    name: "query_sentinel2"
    description: "Query and download Sentinel-2 satellite imagery"
    module: "src.tools.satellite.sentinel2_download"
    endpoint: "https://planetarycomputer.microsoft.com/api/stac/v1"
    permissions: ["read:satellite", "api:planetary_computer"]
    timeout_seconds: 60
    rate_limit:
      requests_per_minute: 30
      requests_per_hour: 200
    cache:
      enabled: true
      ttl_seconds: 3600
    fallback:
