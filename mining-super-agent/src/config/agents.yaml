# agents.yaml — Agent definitions for the Mining Super-Agent
# Council-approved configuration. All 10 agents with tools, models, prompts.

# Model tiers:
#   tier_1: nvidia/nemotron-3-ultra     — complex reasoning (orchestrator)
#   tier_2: meta/llama-3.1-405b-instruct — deep analysis (geo, sat, legal, financial, exploration)
#   tier_3: meta/llama-3.1-8b-instruct   — fast tasks (mineral_id, market, community, qc, quantum)

agents:
  # =========================================================================
  # ORCHESTRATOR — Routes requests to specialist agents
  # =========================================================================
  orchestrator:
    name: "Orchestrator"
    description: "Routes mining requests to appropriate specialist agents"
    model: "nvidia/nemotron-3-ultra"
    model_tier: tier_1
    permissions: ["*"]  # Full access for routing
    tools: []  # Orchestrator uses other agents, not tools directly
    timeout_seconds: 120
    max_tool_calls: 5
    system_prompt: |
      You are the Orchestrator for a Mining Super-Agent system in Kenya.
      Analyze user requests and route to the appropriate specialist agents.
      Run independent agents in parallel when possible.
      Synthesize results from multiple agents into coherent responses.

  # =========================================================================
  # GEOLOGICAL — Rock analysis, deposit models, Kenya geology
  # =========================================================================
  geological:
    name: "Geological"
    description: "Expert geological analyst for Migori Greenstone Belt"
    model: "meta/llama-3.1-405b-instruct"
    model_tier: tier_2
    permissions:
      - read:geo
      - compute:geo
      - api:mindat
      - api:usgs
    tools:
      - query_geological_database
      - run_gempy_model
      - query_mindat
      - analyze_deposit_model
      - run_geophysical_inversion
    timeout_seconds: 180
    max_tool_calls: 8
    system_prompt: |
      Expert geological analyst specializing in Kenya's Migori Greenstone Belt.
      Analyze rock types, deposit models, structural geology, and mineralization.
      Use GemPy for 3D modeling, SimPEG for geophysical inversion.
      Never claim >90% confidence for geological interpretations.

  # =========================================================================
  # SATELLITE — Remote sensing, alteration mapping
  # =========================================================================
  satellite:
    name: "Satellite"
    description: "Satellite imagery analyst for alteration mapping"
    model: "meta/llama-3.1-405b-instruct"
    model_tier: tier_2
    permissions:
      - read:satellite
      - compute:satellite
      - api:planetary_computer
    tools:
      - query_sentinel2
      - calculate_spectral_indices
      - detect_alteration_zones
      - check_cloud_cover
      - query_planetary_computer
    timeout_seconds: 180
    max_tool_calls: 6
    system_prompt: |
      Remote sensing specialist analyzing Sentinel-2 data for mineral exploration.
      Detect hydrothermal alteration (clay, iron oxide, silicification).
      Filter by cloud cover (<20%). Calculate spectral indices.
      Max 75% confidence for satellite-only analysis.

  # =========================================================================
  # MINERAL ID — Photo-based mineral identification
  # =========================================================================
  mineral_id:
    name: "MineralId"
    description: "Mineral identification from photos and physical tests"
    model: "meta/llama-3.1-8b-instruct"
    model_tier: tier_3
    permissions:
      - read:vision
      - model:efficientnet
      - model:clip
    tools:
      - identify_mineral_photo
      - check_look_alikes
      - record_physical_test
      - classify_with_clip
    timeout_seconds: 60
    max_tool_calls: 5
    system_prompt: |
      Identify minerals from photographs using EfficientNet-B4.
      Photo-only ID capped at 65% confidence.
      ALWAYS check look-alikes for economic minerals (gold vs pyrite).
      ALWAYS recommend physical verification.

  # =========================================================================
  # MARKET — Commodity prices and trends
  # =========================================================================
  market:
    name: "Market"
    description: "Market intelligence for commodity prices"
    model: "meta/llama-3.1-8b-instruct"
    model_tier: tier_3
    permissions:
      - read:market
      - api:yfinance
      - api:finnhub
      - api:alpha_vantage
    tools:
      - get_commodity_price
      - get_price_history
      - analyze_price_trend
      - calculate_value
      - generate_swahili_report
    timeout_seconds: 60
    max_tool_calls: 5
    system_prompt: |
      Market intelligence agent for commodity prices.
      Use multi-provider chain: yfinance → Finnhub → Alpha Vantage.
      Report in multiple currencies. Generate Swahili reports when requested.
      Never claim >60% confidence for price predictions.

  # =========================================================================
  # LEGAL — Kenya Mining Act compliance
  # =========================================================================
  legal:
    name: "Legal"
    description: "Legal compliance for Kenya Mining Act 2016"
    model: "meta/llama-3.1-405b-instruct"
    model_tier: tier_2
    permissions:
      - read:legal
      - api:legal_db
    tools:
      - check_license_requirements
      - check_eia_requirements
      - check_fpic_requirements
      - generate_compliance_checklist
      - query_mining_act
    timeout_seconds: 120
    max_tool_calls: 5
    system_prompt: |
      Legal compliance specialist for Kenya Mining Act 2016.
      Cover licensing, EIA, FPIC, community rights, and royalties.
      Always include disclaimer: legal information, not legal advice.

  # =========================================================================
  # FINANCIAL — NPV/IRR, CAPEX/OPEX
  # =========================================================================
  financial:
    name: "Financial"
    description: "Financial modeling for mining projects"
    model: "meta/llama-3.1-405b-instruct"
    model_tier: tier_2
    permissions:
      - compute:financial
      - read:market
    tools:
      - calculate_npv_irr
      - estimate_capex
      - estimate_opex
      - sensitivity_analysis
    timeout_seconds: 120
    max_tool_calls: 5
    system_prompt: |
      Financial modeling agent. Conservative assumptions ONLY.
      NPV/IRR calculations, CAPEX/OPEX estimation, sensitivity analysis.
      Always include disclaimer: indicative, not bankable.

  # =========================================================================
  # COMMUNITY — Stakeholder engagement, FPIC
  # =========================================================================
  community:
    name: "Community"
    description: "Community relations and stakeholder engagement"
    model: "meta/llama-3.1-8b-instruct"
    model_tier: tier_3
    permissions:
      - read:community
    tools:
      - stakeholder_analysis
      - fpic_guidance
      - draft_cda_outline
      - cultural_guidance
    timeout_seconds: 60
    max_tool_calls: 4
    system_prompt: |
      Community relations specialist for mining projects in Kenya.
      Stakeholder analysis, FPIC guidance, CDA support.
      Cultural sensitivity for Luo community in Migori.

  # =========================================================================
  # EXPLORATION — Drilling, sampling, geophysics
  # =========================================================================
  exploration:
    name: "Exploration"
    description: "Exploration planning for drilling and surveys"
    model: "meta/llama-3.1-405b-instruct"
    model_tier: tier_2
    permissions:
      - plan:exploration
      - read:geo
    tools:
      - design_drilling_program
      - design_sampling_strategy
      - plan_geophysical_survey
      - estimate_exploration_costs
    timeout_seconds: 120
    max_tool_calls: 5
    system_prompt: |
      Exploration planning agent.
      Design drilling programs, sampling strategies, geophysical surveys.
      Provide cost estimates with 20% contingency.

  # =========================================================================
  # QC — Quality control and cross-validation
  # =========================================================================
  qc:
    name: "QC"
    description: "Quality control and cross-validation"
    model: "meta/llama-3.1-8b-instruct"
    model_tier: tier_3
    permissions:
      - qc:validate
    tools:
      - cross_check_results
      - validate_confidence
      - check_data_quality
      - flag_conflicts
    timeout_seconds: 60
    max_tool_calls: 3
    system_prompt: |
      Quality control agent. Cross-check results from other agents.
      Validate confidence scores. Flag conflicts.
      Photo ID max 65%, Market max 60%, Geological max 85%.

  # =========================================================================
  # QUANTUM — Quantum ML and optimization
  # =========================================================================
  quantum:
    name: "Quantum"
    description: "Quantum computing for mineral classification and optimization"
    model: "meta/llama-3.1-8b-instruct"
    model_tier: tier_3
    permissions:
      - quantum:compute
      - classical:compute
    tools:
      - quantum_mineral_classify
      - quantum_drill_optimize
      - quantum_feature_map
      - classical_fallback
    timeout_seconds: 120
    max_tool_calls: 4
    system_prompt: |
      Quantum computing agent for mining problems.
      PennyLane quantum kernel for gold vs pyrite classification.
      Qiskit QAOA for drill target optimization.
      ALL operations have classical fallbacks.

# ===========================================================================
# Agent-to-tool mapping (redundant with above, but useful for tool registry)
# ===========================================================================
