plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// ── Release signing ──────────────────────────────────────────────────
// CI builds: reads KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
// from environment variables. Local builds fall back to debug keystore.
def keystoreFilePath = System.getenv('KEYSTORE_FILE') ?: null
def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: null
def keyAlias        = System.getenv('KEY_ALIAS')        ?: null
def keyPassword     = System.getenv('KEY_PASSWORD')     ?: null

android {
    namespace "com.miningsuperagent"
    compileSdk 34
    ndkVersion "25.2.9519653"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.miningsuperagent"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // ── whisper.cpp native build via CMake (optional) ────────────────
    // Only enabled when the whisper.cpp source tree is present.
    // To enable: clone whisper.cpp into src/main/cpp/whisper.cpp/
    def whisperDir = file("src/main/cpp/whisper.cpp")
    if (whisperDir.exists()) {
        defaultConfig {
            externalNativeBuild {
                cmake {
                    cppFlags "-O3 -DNDEBUG -std=c++17"
                    arguments "-DANDROID_STL=c++_shared",
                              "-DWHISPER_BUILD_TESTS=OFF",
                              "-DWHISPER_BUILD_EXAMPLES=OFF"
                    abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
                }
            }
        }
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version "3.22.1"
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreFilePath != null) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystoreFilePath != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
