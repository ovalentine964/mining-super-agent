<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Mining Analysis Report</title></head>
<body>
<h1>Mining Analysis Report</h1>
<p>Generated: {{ date }}</p>
<h2>Summary</h2>
<p>{{ summary }}</p>
<h2>Mineral Identification</h2>
<table>
<tr><th>Property</th><th>Value</th></tr>
<tr><td>Mineral</td><td>{{ mineral }}</td></tr>
<tr><td>Confidence</td><td>{{ confidence }}%</td></tr>
<tr><td>Source</td><td>{{ source_type }}</td></tr>
</table>
<h2>Disclaimers</h2>
<ul>{% for d in disclaimers %}<li>{{ d }}</li>{% endfor %}</ul>
</body>
</html>
