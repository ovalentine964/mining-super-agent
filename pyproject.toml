[project]
name = "sovereign-resource-dao"
version = "2.0.0"
description = "Sovereign Resource DAO — Institutional-grade platform for mineral exploration, geological analysis, market intelligence, and decentralized resource governance. Powered by DeerFlow 2.0."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Valentine Owuor", email = "valentine@sovereignresourcedao.com"}
]

dependencies = [
    # ── DeerFlow Harness (core super-agent engine) ──────────────
    "deerflow-harness>=2.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # DeerFlow Gateway & Channels
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.1.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",

    # Core
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.14.0",

    # Vector DB
    "qdrant-client>=1.9.0",

    # Cache
    "redis>=5.0.0",

    # AI/ML
    "langchain-nvidia-ai-endpoints>=0.2.0",
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.9.0",

    # Quantum
    "pennylane>=0.37.0",
    "qiskit>=1.1.0",
    "qiskit-aer>=0.14.0",

    # Satellite
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",

    # Geological
    "gempy>=3.0.0",
    "simpeg>=0.21.0",

    # Market Data
    "yfinance>=0.2.38",
    "numpy-financial>=1.0.0",  # replaces removed np.npv/np.irr

    # Blockchain
    "web3>=6.0.0",

    # ML/NLP
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",

    # Satellite data
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",

    # Reports
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",

    # Monitoring
    "prometheus-client>=0.20.0",

    # Sandbox execution
    "e2b-code-interpreter>=2.8.1",

    # Key rotation
    "psycopg2-binary>=2.9.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
]
deerflow-local = [
    # Install DeerFlow harness from local submodule instead of PyPI
    # Use: pip install -e '.[deerflow-local]'
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
